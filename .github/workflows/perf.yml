# Level 3: optional performance benchmark. Manual trigger only; never runs on pushes or pull requests.
name: CI level 3 (performance, manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "What to benchmark: branch, tag, commit SHA, or refs/pull/<number>/head"
        required: true
        default: main
      users:
        description: "Concurrent simulated users (1-50)"
        required: true
        default: "20"
      duration:
        description: "Run time in seconds (10-300)"
        required: true
        default: "60"

permissions:
  contents: read

concurrency:
  group: ci3-perf
  cancel-in-progress: false

jobs:
  perf:
    name: Locust against a local API and disposable database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: local
      AUTH_MODE: local
      LOCAL_AUTH_SECRET: perf-only-demo-signing-value
      DATABASE_URL: postgresql+psycopg://bolmava:bolmava@localhost:5432/bolmava_perf
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      USERS: ${{ inputs.users }}
      DURATION: ${{ inputs.duration }}
      REF: ${{ inputs.ref }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Validate inputs
        run: |
          [[ "$USERS" =~ ^[0-9]+$ && "$USERS" -ge 1 && "$USERS" -le 50 ]] || { echo "users must be 1-50"; exit 1; }
          [[ "$DURATION" =~ ^[0-9]+$ && "$DURATION" -ge 10 && "$DURATION" -le 300 ]] || { echo "duration must be 10-300"; exit 1; }
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/perf/requirements.txt
      - name: Install the API and, separately, Locust
        run: |
          python -m pip install -r requirements.txt
          python -m venv /tmp/perfvenv && /tmp/perfvenv/bin/pip install -r perf/requirements.txt
      - name: Disposable database with fictional seed data
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE bolmava LOGIN PASSWORD 'bolmava'" -c "CREATE DATABASE bolmava_perf OWNER bolmava"
          alembic upgrade head
          python -m app.seed
      - name: Start the API on localhost only
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat /tmp/uvicorn.log; exit 1
      - name: Benchmark
        run: |
          mkdir -p ../perf-results
          /tmp/perfvenv/bin/locust -f perf/locustfile.py --headless -u "$USERS" -r 5 -t "${DURATION}s" \
            --host http://127.0.0.1:8000 --csv ../perf-results/perf --html ../perf-results/report.html --only-summary || true
          python perf/summary.py ../perf-results/perf_stats.csv "${USERS} users, spawn 5/s, ${DURATION} s, 1 uvicorn worker, ref ${REF}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf-results/
          retention-days: 14
