# Level 2: browser end-to-end tests. Runs on pull requests labelled "e2e"; manual runs go through manual.yml.
name: CI level 2 (browser end-to-end)

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_call:
    inputs:
      ref:
        description: "What to test: branch, tag, commit SHA, or refs/pull/<number>/head"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci2-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium) against FastAPI + PostgreSQL + Vite
    # Important PRs opt in with the "e2e" label; adding an unrelated label does not start a run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: "true"
      # Disposable database inside this job only; the suite refuses any name not ending in _e2e or any non-local host.
      E2E_DATABASE_URL: postgresql+psycopg://bolmava:bolmava@localhost:5432/bolmava_e2e
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Create the disposable end-to-end database
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE bolmava LOGIN PASSWORD 'bolmava'" -c "CREATE DATABASE bolmava_e2e OWNER bolmava"
      - name: Install frontend dependencies and Chromium only
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests (the suite rebuilds and seeds the database, then starts uvicorn and Vite)
        working-directory: frontend
        run: npx playwright test
      - name: Summary
        if: always()
        run: python .github/scripts/junit_summary.py frontend/playwright-report/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Keep report, screenshots and traces when a test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
