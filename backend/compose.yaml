# Local development database only. Not a production configuration.
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: bolmava
      POSTGRES_PASSWORD: bolmava
      POSTGRES_DB: bolmava
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolmava"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
